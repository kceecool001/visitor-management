spring.application.name=visitordesk

server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:visitordesk}
spring.datasource.username=${DB_USER:visitordesk}
spring.datasource.password=${DB_PASSWORD:visitordesk}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

app.host.company=${HOST_COMPANY:Our Company}
