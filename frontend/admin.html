<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VisitorDesk Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<div id="login-screen" class="screen active">
    <div class="container admin-container">
        <h1>Admin Login</h1>
        <form id="login-form">
            <div class="form-group">
                <input type="password" id="password" placeholder="Admin Password" required>
            </div>
            <button type="submit" class="btn-primary">Login</button>
            <div id="login-error" class="error-message"></div>
        </form>
    </div>
</div>

<div id="dashboard-screen" class="screen">
    <div class="container admin-container">
        <h1>Visitor Dashboard</h1>

        <div class="admin-controls">
            <input type="text" id="search-input" placeholder="Search visitors...">
            <input type="date" id="date-filter">
            <button id="clear-filter" class="btn-secondary">Clear</button>
        </div>

        <div id="loading" class="loading">Loading...</div>
        <div id="no-data" class="no-data">No visitors found.</div>

        <table class="visitor-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Company</th>
                    <th>Department</th>
                    <th>Check-in Time</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="visitors-tbody"></tbody>
        </table>

        <p class="visitor-count">Total visitors: <span id="visitor-count">0</span></p>

        <button id="logout-btn" class="btn-secondary">Logout</button>
    </div>
</div>

<script src="admin.js"></script>
</body>
</html>
