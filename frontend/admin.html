<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-screen" class="screen active">
    <div class="container">
        <h1>Admin Login</h1>
        <form id="login-form">
            <div class="form-group">
                <input type="password" id="password" placeholder="Admin Password" required>
            </div>
            <button type="submit" class="btn-primary">Login</button>
            <div id="login-error" class="error-message"></div>
        </form>
    </div>
</div>

<div id="dashboard-screen" class="screen">
    <div class="container">
        <h1>Visitor Dashboard</h1>

        <div class="form-group">
            <input type="text" id="search-input" placeholder="Search by name or company">
        </div>

        <div class="form-group">
            <input type="date" id="date-filter">
            <button id="clear-filter" class="btn-secondary">Clear Filters</button>
        </div>

        <div id="loading" class="error-message">Loading...</div>
        <div id="no-data" class="error-message">No visitors found.</div>

        <table>
            <tbody id="visitors-tbody"></tbody>
        </table>

        <p>Total visitors: <span id="visitor-count">0</span></p>
        <button id="logout-btn" class="btn-secondary">Logout</button>
    </div>
</div>

<script src="admin.js"></script>
</body>
</html>
