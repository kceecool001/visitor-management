version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: visitordesk-db
    environment:
      POSTGRES_DB: visitordesk
      POSTGRES_USER: visitordesk
      POSTGRES_PASSWORD: visitordesk
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visitordesk -d visitordesk"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - visitordesk-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: visitordesk-backend
    environment:
      HOST_COMPANY: "Our Company"
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: visitordesk
      DB_USER: visitordesk
      DB_PASSWORD: visitordesk
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - visitordesk-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: visitordesk-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - visitordesk-network

volumes:
  postgres_data:
    driver: local

networks:
  visitordesk-network:
    driver: bridge
