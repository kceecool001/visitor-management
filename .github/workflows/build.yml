name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Gitleaks secret scan
        continue-on-error: true
        run: |
          docker run --rm -v $(pwd):/repo zricethezav/gitleaks:latest detect --source /repo --report-path /repo/gitleaks-report.json --report-format json --verbose || true
          if [ -f gitleaks-report.json ]; then
            echo "===== SECRET SCAN SUMMARY ====="
            SECRET_COUNT=$(jq '. | length' gitleaks-report.json 2>/dev/null || echo "0")
            echo "Secrets found: $SECRET_COUNT"
            if [ "$SECRET_COUNT" -gt 0 ]; then
              echo "Details:"
              jq -r '.[] | "  - \(.RuleID) in \(.File):\(.StartLine)"' gitleaks-report.json || true
            fi
            echo "==============================="
          else
            echo "No secrets detected"
            echo '[]' > gitleaks-report.json
          fi
      
      - name: Upload secret scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-scan-report
          path: gitleaks-report.json

  dependency-vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Run OWASP Dependency Check
        continue-on-error: true
        working-directory: ./backend
        run: |
          mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=11 || true
          if [ -f target/dependency-check-report.html ]; then
            echo "===== DEPENDENCY VULNERABILITY SUMMARY ====="
            if [ -f target/dependency-check-report.json ]; then
              CRITICAL=$(jq '[.dependencies[].vulnerabilities[]? | select(.severity=="CRITICAL")] | length' target/dependency-check-report.json 2>/dev/null || echo "0")
              HIGH=$(jq '[.dependencies[].vulnerabilities[]? | select(.severity=="HIGH")] | length' target/dependency-check-report.json 2>/dev/null || echo "0")
              MEDIUM=$(jq '[.dependencies[].vulnerabilities[]? | select(.severity=="MEDIUM")] | length' target/dependency-check-report.json 2>/dev/null || echo "0")
              LOW=$(jq '[.dependencies[].vulnerabilities[]? | select(.severity=="LOW")] | length' target/dependency-check-report.json 2>/dev/null || echo "0")
              echo "Critical: $CRITICAL"
              echo "High: $HIGH"
              echo "Medium: $MEDIUM"
              echo "Low: $LOW"
            fi
            echo "============================================"
          fi
      
      - name: Upload dependency check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.*

  sast-semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Semgrep SAST scan
        continue-on-error: true
        run: |
          docker run --rm -v $(pwd):/src returntocorp/semgrep semgrep --config=auto --json --output=/src/semgrep-report.json /src || true
          if [ -f semgrep-report.json ]; then
            echo "===== SAST SCAN SUMMARY ====="
            HIGH=$(jq '[.results[] | select(.extra.severity=="ERROR")] | length' semgrep-report.json 2>/dev/null || echo "0")
            MEDIUM=$(jq '[.results[] | select(.extra.severity=="WARNING")] | length' semgrep-report.json 2>/dev/null || echo "0")
            INFO=$(jq '[.results[] | select(.extra.severity=="INFO")] | length' semgrep-report.json 2>/dev/null || echo "0")
            echo "High severity: $HIGH"
            echo "Medium severity: $MEDIUM"
            echo "Info: $INFO"
            echo "============================="
          else
            echo "No SAST findings"
            echo '{"results":[]}' > semgrep-report.json
          fi
      
      - name: Upload SAST report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-report
          path: semgrep-report.json

  dockerfile-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Hadolint on frontend Dockerfile
        continue-on-error: true
        run: |
          docker run --rm -i hadolint/hadolint < frontend/Dockerfile > hadolint-frontend.txt || true
          echo "===== HADOLINT FRONTEND DOCKERFILE ====="
          cat hadolint-frontend.txt || echo "No issues found"
          echo "========================================"
      
      - name: Run Hadolint on backend Dockerfile
        continue-on-error: true
        run: |
          docker run --rm -i hadolint/hadolint < backend/Dockerfile > hadolint-backend.txt || true
          echo "===== HADOLINT BACKEND DOCKERFILE ====="
          cat hadolint-backend.txt || echo "No issues found"
          echo "======================================="
      
      - name: Combine Hadolint reports
        if: always()
        run: |
          echo "=== Frontend Dockerfile ===" > hadolint-report.txt
          cat hadolint-frontend.txt >> hadolint-report.txt || true
          echo "" >> hadolint-report.txt
          echo "=== Backend Dockerfile ===" >> hadolint-report.txt
          cat hadolint-backend.txt >> hadolint-report.txt || true
      
      - name: Upload Hadolint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hadolint-report
          path: hadolint-report.txt

  license-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Run license check
        continue-on-error: true
        working-directory: ./backend
        run: |
          mvn license:add-third-party -Dlicense.outputDirectory=. || true
          if [ -f THIRD-PARTY.txt ]; then
            echo "===== LICENSE CHECK SUMMARY ====="
            echo "Third-party licenses detected:"
            cat THIRD-PARTY.txt | head -50
            echo ""
            echo "Checking for restrictive licenses..."
            grep -iE "(GPL|AGPL|LGPL|SSPL|Commons Clause)" THIRD-PARTY.txt || echo "No highly restrictive licenses found"
            echo "================================="
          fi
      
      - name: Upload license report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: license-check-report
          path: backend/THIRD-PARTY.txt

  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Run backend tests
        working-directory: ./backend
        run: mvn test
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/visitordesk-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/visitordesk-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/visitordesk-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/visitordesk-frontend:buildcache,mode=max
      
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/visitordesk-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/visitordesk-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/visitordesk-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/visitordesk-backend:buildcache,mode=max

  container-image-scanning:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Pull frontend image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/visitordesk-frontend:${{ github.sha }}
      
      - name: Run Trivy scan on frontend image
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd):/output \
            aquasec/trivy image \
            --format json \
            --output /output/trivy-frontend.json \
            ${{ secrets.DOCKER_USERNAME }}/visitordesk-frontend:${{ github.sha }} || true
          
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd):/output \
            aquasec/trivy image \
            --format sarif \
            --output /output/trivy-frontend.sarif \
            ${{ secrets.DOCKER_USERNAME }}/visitordesk-frontend:${{ github.sha }} || true
          
          if [ -f trivy-frontend.json ]; then
            echo "===== TRIVY FRONTEND IMAGE SCAN ====="
            docker run --rm -v $(pwd):/output aquasec/trivy image --format table ${{ secrets.DOCKER_USERNAME }}/visitordesk-frontend:${{ github.sha }} || true
            CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-frontend.json 2>/dev/null || echo "0")
            HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-frontend.json 2>/dev/null || echo "0")
            MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-frontend.json 2>/dev/null || echo "0")
            echo "Critical: $CRITICAL, High: $HIGH, Medium: $MEDIUM"
            echo "====================================="
          fi
      
      - name: Pull backend image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/visitordesk-backend:${{ github.sha }}
      
      - name: Run Trivy scan on backend image
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd):/output \
            aquasec/trivy image \
            --format json \
            --output /output/trivy-backend.json \
            ${{ secrets.DOCKER_USERNAME }}/visitordesk-backend:${{ github.sha }} || true
          
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd):/output \
            aquasec/trivy image \
            --format sarif \
            --output /output/trivy-backend.sarif \
            ${{ secrets.DOCKER_USERNAME }}/visitordesk-backend:${{ github.sha }} || true
          
          if [ -f trivy-backend.json ]; then
            echo "===== TRIVY BACKEND IMAGE SCAN ====="
            docker run --rm -v $(pwd):/output aquasec/trivy image --format table ${{ secrets.DOCKER_USERNAME }}/visitordesk-backend:${{ github.sha }} || true
            CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-backend.json 2>/dev/null || echo "0")
            HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-backend.json 2>/dev/null || echo "0")
            MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-backend.json 2>/dev/null || echo "0")
            echo "Critical: $CRITICAL, High: $HIGH, Medium: $MEDIUM"
            echo "===================================="
          fi
      
      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend
      
      - name: Upload Trivy SARIF to GitHub Security (Backend)
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        if: always()
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend
      
      - name: Upload Trivy scan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-report
          path: |
            trivy-frontend.json
            trivy-backend.json
            trivy-frontend.sarif
            trivy-backend.sarif

  security-summary:
    runs-on: ubuntu-latest
    needs: [secret-scanning, dependency-vulnerability-scan, sast-semgrep, dockerfile-lint, license-check, container-image-scanning]
    if: always()
    
    steps:
      - name: Download all security artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
      
      - name: Generate security summary
        run: |
          echo "=========================================="
          echo "===== VISITORI understand you want me to update `.github/workflows/build.yml` to add comprehensive DevSecOps security scanning stages that never fail the pipeline. Let me add all the security scanning stages with the requirements you specified.

.github/workflows/build.yml
